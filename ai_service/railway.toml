# Railway hosts the Python FastAPI AI only (ai_service/Dockerfile).
# PHP/UI still deploys to Hostinger via GitLab CI.
#
# Do NOT set watchPatterns here. Empty Watch Paths (default) = deploy on every
# push to the connected GitHub branch. A pattern like "**" can skip deploys.
# In Railway UI: Settings → Build → Watch Paths must also be empty.
# Settings → Source → branch = main. Then Cmd/Ctrl+K → "Deploy Latest Commit"
# if a push was missed.

[build]
builder = "DOCKERFILE"
dockerfilePath = "ai_service/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
