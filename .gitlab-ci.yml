# MedConnect — GitLab CI
# Validate on every push; auto-deploy to production (medconnect.bccbsis.com) on main
# when DEPLOY_* CI/CD variables are set (Settings → CI/CD → Variables).

stages:
  - validate
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.11"

# ── Validate ─────────────────────────────────────────────────────────────────

php:syntax:
  stage: validate
  image: php:8.2-cli
  script:
    - |
      set -e
      FILES=$(git diff-tree --no-commit-id --name-only -r "$CI_COMMIT_SHA" 2>/dev/null | grep '\.php$' || true)
      if [ -z "$FILES" ]; then
        FILES=$(find app public config bootstrap -name '*.php' 2>/dev/null | head -200)
      fi
      for f in $FILES; do
        [ -f "$f" ] || continue
        php -l "$f" || exit 1
      done
      echo "PHP syntax OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

python:fastapi:
  stage: validate
  image: python:3.11-slim
  before_script:
    - pip install --quiet -r ai_service/requirements.txt
  script:
    - cd ai_service && python -c "from app.main import app; print('FastAPI OK:', app.title)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  allow_failure: true

# ── Deploy (automatic on main) ────────────────────────────────────────────────
# Requires GitLab CI/CD variables (masked/protected):
#   DEPLOY_FTP_HOST, DEPLOY_FTP_USER, DEPLOY_FTP_PASS
# Optional:
#   DEPLOY_FTP_PORT (default 21), DEPLOY_FTP_REMOTE_DIR (default .),
#   DEPLOY_FTP_SSL (true|false, default true for FTPS)

deploy:production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: php:syntax
      optional: true
  before_script:
    - apk add --no-cache lftp bash
  script:
    - bash scripts/ci/deploy_ftp.sh
  environment:
    name: production
    url: https://medconnect.bccbsis.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_FTP_HOST
      when: on_success
    - when: never
