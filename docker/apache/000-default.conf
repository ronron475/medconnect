ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Trust Reverse Proxy (Railway / Cloudflare)
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16

    # Allow htaccess rules in document root
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Security Denials (Defense in Depth) ───────────────────────────
    # Deny direct access to internal application code
    <DirectoryMatch "^/var/www/html/app/(core|includes|models)">
        Require all denied
    </DirectoryMatch>

    # Deny direct access to framework internals and source folders
    <DirectoryMatch "^/var/www/html/(bootstrap|config|data|database|resources|scripts|ai_service)">
        Require all denied
    </DirectoryMatch>

    # Deny direct access to all storage files (uploads, patient IDs, logs, backups, recordings)
    # Public assets and avatars are delivered exclusively via authorized PHP endpoints
    <DirectoryMatch "^/var/www/html/storage">
        Require all denied
    </DirectoryMatch>

    # Deny sensitive files and hidden files by pattern
    <FilesMatch "(^\.env|^\.git|\.(env|sql|log|md|lock|git|sh|bat|bak|ini|ya?ml|conf|key|pem|crt))$">
        Require all denied
    </FilesMatch>

    # Deny package manifests
    <FilesMatch "^(composer|package(-lock)?)\.json$">
        Require all denied
    </FilesMatch>

    # Deny root bootstrap script
    <FilesMatch "^bootstrap\.php$">
        Require all denied
    </FilesMatch>
</VirtualHost>
